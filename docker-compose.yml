networks:
  mentoring-net:
    name: mentoring-net
    external: false

services:
  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    networks:
      - mentoring-net
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mentoring-net
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_cache:
